    // Function 1: Success Message
    function success() {
        document.querySelector('#result').innerHTML =
            '<h3>Welcome Ihsan! Login Successful</h3>';
    }

    // Function 2: Error Message
    function error() {
        document.querySelector('#result').innerHTML =
            '<h3>Invalid Email or Password!</h3>';
    }


    // Function 3: Login System
    function checkLogin(email, password, callback) {

        if (email === 'ihsan@gmail.com' && password === '1234') {

            callback(true);

        } else {

            callback(false);
        }
    }


    // Function 4: Login Button
    function login() {

        let email = document.querySelector('#email').value;
        let password = document.querySelector('#password').value;

        checkLogin(email, password, function (status) {

            if (status === true) {
                success();
            } else {
                error();
            }

        });
    }

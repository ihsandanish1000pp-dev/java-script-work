let payment = new Promise(function(resolve, reject) {

    let balance = 5000;
    let amount = 2000;

    if (balance >= amount) {

        resolve('Payment Successful');

    } else {

        reject('Payment Rejected');

    }

});


payment.then((msg) => {
    document.write(msg);
});

payment.catch((error) => {
    document.write(error);
});

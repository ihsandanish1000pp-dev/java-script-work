<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Login System</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <br><br>

    <input type="password" id="password" placeholder="Enter Password">

    <br><br>

    <button onclick="login()">Login</button>

    <div id="result"></div>
</body>



<script>
    // Function 1: Success Message
    function success() {
        document.querySelector('#result').innerHTML =
            '<h3>Welcome Ihsan! Login Successful</h3>';
    }

    // Function 2: Error Message
    function error() {
        document.querySelector('#result').innerHTML =
            '<h3>Invalid Email or Password!</h3>';
    }


    // Function 3: Login System
    function checkLogin(email, password, callback) {

        if (email === 'ihsan@gmail.com' && password === '1234') {

            callback(true);

        } else {

            callback(false);
        }
    }


    // Function 4: Login Button
    function login() {

        let email = document.querySelector('#email').value;
        let password = document.querySelector('#password').value;

        checkLogin(email, password, function (status) {

            if (status === true) {
                success();
            } else {
                error();
            }

        });
    }
</script>

</html>

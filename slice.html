
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Products</title>
</head>
<body>

    <h2>Online Shopping Store</h2>

    <button onclick="showProducts()">Show Products</button>

    <div id="result"></div>

    <h3 id="total"></h3>

    <script>

        // All Products
        let products = [
            'Laptop',
            'Mobile',
            'Keyboard',
            'Mouse',
            'Monitor',
            'Headphones',
            'Charger',
            'Smart Watch'
        ];

        function showProducts() {

            // Select first 4 products
            let selectedProducts = products.slice(1, 4 );

            // Display products
            document.getElementById('result').innerHTML =
                selectedProducts.join('<br>');

            // Total products
            document.getElementById('total').innerHTML =
                'Showing Products: ' + selectedProducts.length;
        }

    </script>

</body>
</html>

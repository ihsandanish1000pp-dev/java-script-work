<script>

       let i = ['Ihsan' , 'Danihs' , 'Khan'];
       i.unshift('Mubrik');
       document.write(i.join('<br/>'));



    let student = ['Ihsan', 'Danihs', 'Khan', 'Sami'];
    let std = '';
    student.unshift('Ali');
    student.unshift('Ahmad');
    for (let i = 0; i < student.length; i++) {
        std += (i + 1) + " : " + student[i] + "<br/>";
    }
    document.write(std);
    document.write(`Total Student : ` + student.length)
</script>
